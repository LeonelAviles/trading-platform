# Full stack on one ~8.6 GB machine (PLATFORM-SPEC.md §5 Phase 0, §11).
# Memory caps leave >2 GB free for the OS and the browser:
#   backend 3 GB (API + DuckDB 2 GB limit + one Nautilus subprocess at a time)
#   frontend 512 MB (static preview server)
#   neo4j   1.5 GB (heap 768 MB + page cache 256 MB + JVM overhead)
#
# Bare-metal alternative: `make dev`.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8123:8123"
    env_file:
      - backend/.env
    environment:
      DATABASE_URL: sqlite+pysqlite:////app/data/platform.db
      NEO4J_URI: bolt://neo4j:7687
      DUCKDB_MEMORY_LIMIT: 2GB
    volumes:
      - ./market-data:/app/market-data
      - ./data:/app/data
      - ./backtests:/app/backtests
      # Legacy DuckDB store until Phase 1 replaces it with data/market.
      - ./mbo-data:/app/mbo-data
    depends_on:
      - neo4j
    deploy:
      resources:
        limits:
          memory: 3g
    mem_limit: 3g
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY: http://backend:8123
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 512m
    mem_limit: 512m
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    ports:
      - "7474:7474"   # browser UI
      - "7687:7687"   # bolt
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-change-me-neo4j}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 768m
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    deploy:
      resources:
        limits:
          memory: 1536m
    mem_limit: 1536m
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
