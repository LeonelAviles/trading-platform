name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r backend/requirements.txt
      - name: Test
        working-directory: backend
        env:
          DATABASE_URL: sqlite+pysqlite:///./data/ci.db
          PLATFORM_SKIP_DB_INIT: "1"
        run: python -m pytest -q

  backend-postgres:
    name: backend (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: trading
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: trading_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trading -d trading_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install
        run: pip install -r backend/requirements.txt
      - name: Test
        working-directory: backend
        env:
          DATABASE_URL: sqlite+pysqlite:///./data/ci.db
          PLATFORM_SKIP_DB_INIT: "1"
          TEST_POSTGRES_URL: postgresql+psycopg://trading:ci-only-password@127.0.0.1:5432/trading_test
        run: python -m pytest -q

  frontend:
    name: frontend (lint, build, vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Test
        working-directory: frontend
        run: |
          if node -e "process.exit(require('./package.json').scripts.test ? 0 : 1)"; then
            npm test -- --run
          else
            echo "no frontend tests yet"
          fi
